name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: universal
          - os: windows-latest
            platform: windows
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        run: wails build -platform darwin/universal

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: wails build -platform windows/amd64

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: mailtap-macos
          path: build/bin/*.app

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mailtap-windows
          path: build/bin/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip macOS app
        run: cd artifacts/mailtap-macos && zip -r ../../mailtap-macos.zip . && cd ../..

      - name: Zip Windows app
        run: cd artifacts/mailtap-windows && zip -r ../../mailtap-windows.zip . && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mailtap-macos.zip
            mailtap-windows.zip
          generate_release_notes: true
